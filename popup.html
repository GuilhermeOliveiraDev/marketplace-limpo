<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Marketplace Limpo</title>
  <style>
    :root {
      --paper: #fff;
      --ink: #14161a;
      --muted: #767b83;
      --line: #e7e9ec;
      --line-strong: #c9ced5;
      --catch: #d31f45;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #1b1d21;
        --ink: #e9eaec;
        --muted: #8f959d;
        --line: #2e3238;
        --line-strong: #464c54;
        --catch: #ff5d78;
      }
    }

    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: var(--paper);
      color: var(--ink);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .eyebrow {
      margin: 0;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      margin: 1px 0 0;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* Interruptor */
    .sw { position: relative; display: inline-flex; flex: none; }
    .sw input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }
    .track {
      width: 30px;
      height: 18px;
      border-radius: 999px;
      background: var(--line-strong);
      transition: background 0.15s ease;
    }
    .track::after {
      content: "";
      display: block;
      width: 14px;
      height: 14px;
      margin: 2px;
      border-radius: 50%;
      background: var(--paper);
      transition: transform 0.15s ease;
    }
    .sw input:checked + .track { background: var(--ink); }
    .sw input:checked + .track::after { transform: translateX(12px); }
    .sw input:focus-visible + .track { outline: 2px solid var(--catch); outline-offset: 2px; }

    /* A cadeia de filtros, na ordem em que rodam */
    .chain {
      position: relative;
      list-style: none;
      margin: 14px 0 0;
      padding: 0;
    }
    .chain::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 16px;
      bottom: 16px;
      width: 1px;
      background: var(--line);
    }
    .stage {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto 30px;
      align-items: center;
      gap: 10px;
      padding: 8px 0 8px 20px;
    }
    .stage::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 9px;
      height: 9px;
      margin-top: -4.5px;
      border-radius: 50%;
      background: var(--paper);
      border: 1.5px solid var(--line-strong);
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    /* O ponto acende só quando aquele estágio está pegando algo agora. Quem está
       ligado mas de mãos vazias fica igual a quem está desligado — o interruptor
       já diz se está ligado, o ponto não precisa repetir. */
    .stage.acting.caught::before { background: var(--catch); border-color: var(--catch); }

    .name em {
      font-style: normal;
      font-size: 11px;
      color: var(--muted);
    }
    .name em::before { content: " · "; }

    /* O ponto já sinaliza "pegou"; o número só precisa ser legível. Pintar os dois de
       vermelho gastaria o acento em duas vezes a mesma informação. */
    .count {
      min-width: 2.5ch;
      text-align: right;
      font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    .stage.caught .count { color: var(--ink); }
    body.sem-dados .count { visibility: hidden; }

    .vazio {
      margin: 12px 0 0;
      padding-left: 20px;
      font-size: 11.5px;
      color: var(--muted);
    }
    body:not(.sem-dados) .vazio { display: none; }

    /* Lista de palavras */
    .words { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
    .words label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    textarea {
      width: 100%;
      min-height: 68px;
      margin-top: 6px;
      padding: 8px 9px;
      resize: vertical;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--paper);
      color: var(--ink);
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    textarea:focus-visible { outline: 2px solid var(--catch); outline-offset: 1px; border-color: transparent; }
    .micro { margin: 6px 0 0; font-size: 11px; color: var(--muted); }

    body.off .chain, body.off .words { opacity: 0.4; }

    /* `*` sozinho não alcança pseudo-elemento, e é neles que estão o botão do
       interruptor e o ponto da cadeia — as duas únicas coisas que se movem aqui. */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>
<body class="sem-dados">
  <header>
    <div>
      <p class="eyebrow">Facebook Marketplace</p>
      <h1>Limpo</h1>
    </div>
    <label class="sw">
      <input type="checkbox" id="enabled" aria-label="Ativar a limpeza" />
      <span class="track"></span>
    </label>
  </header>

  <ol class="chain">
    <li class="stage" data-motivo="patrocinados">
      <span class="name">Patrocinados</span>
      <span class="count">0</span>
      <label class="sw">
        <input type="checkbox" id="hideSponsored" aria-label="Ocultar patrocinados" />
        <span class="track"></span>
      </label>
    </li>
    <li class="stage acting" data-motivo="palavra proibida">
      <span class="name">Palavras proibidas <em>lista abaixo</em></span>
      <span class="count">0</span>
      <span></span>
    </li>
    <li class="stage" data-motivo="fora da busca">
      <span class="name">Fora da busca</span>
      <span class="count">0</span>
      <label class="sw">
        <input type="checkbox" id="exactMatch" aria-label="Ocultar anúncios fora da busca" />
        <span class="track"></span>
      </label>
    </li>
    <li class="stage acting" data-motivo="fora da faixa de preço">
      <span class="name">Fora do preço <em>no Facebook</em></span>
      <span class="count">0</span>
      <span></span>
    </li>
    <li class="stage" data-motivo="duplicados">
      <span class="name">Duplicados</span>
      <span class="count">0</span>
      <label class="sw">
        <input type="checkbox" id="dedupe" aria-label="Ocultar anúncios duplicados" />
        <span class="track"></span>
      </label>
    </li>
  </ol>

  <p class="vazio">Abra uma busca no Marketplace.</p>

  <section class="words">
    <label for="blacklist">Palavras proibidas</label>
    <textarea id="blacklist" spellcheck="false" placeholder="aceito troca&#10;defeito&#10;leia a descrição"></textarea>
    <p class="micro">Uma por linha · casa palavra inteira</p>
  </section>

  <script src="popup.js"></script>
</body>
</html>
